name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python 3.10 TOML fallback
        if: matrix.python-version == '3.10'
        run: python -m pip install tomli
      - name: Check packaged runtime
        run: python scripts/package_runtime.py --check
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q .agents/skills/install-codex-agent-foundry/scripts scripts tests

  python310-error-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Ensure tomli is absent
        run: python -m pip uninstall -y tomli || true
      - name: Check friendly Python 3.10 dependency error
        shell: bash
        run: |
          set +e
          install_out=$(python .agents/skills/install-codex-agent-foundry/scripts/install.py --check 2>&1)
          install_code=$?
          verify_out=$(python .agents/skills/install-codex-agent-foundry/scripts/verify.py --help 2>&1)
          verify_code=$?
          set -e

          test "$install_code" -eq 2
          test "$verify_code" -eq 2
          grep -F "requires Python 3.11+ or Python 3.10 with the 'tomli' package" <<<"$install_out"
          grep -F "requires Python 3.11+ or Python 3.10 with the 'tomli' package" <<<"$verify_out"
